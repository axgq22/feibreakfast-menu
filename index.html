<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肥寶今天吃什麼？</title>
    <style>
        :root {
            --bg-deep: #12070f;
            --bg-deep-2: #1c0b1a;
            --plum: #3a1030;
            --wine: #7a1f3d;
            --wine-bright: #b0294f;
            --rose-gold: #e0a89a;
            --rose-gold-soft: #f0c6b8;
            --ink: #f3e6ea;
            --ink-dim: #b79aa8;
            --gold-line: rgba(224, 168, 154, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background:
                radial-gradient(ellipse at 20% 10%, rgba(122, 31, 61, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 85%, rgba(58, 16, 48, 0.5) 0%, transparent 60%),
                linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            position: relative;
            overflow-x: hidden;
        }

        /* Scorpius constellation, faint, fixed in the background */
        .constellation {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.35;
            pointer-events: none;
        }

        .container {
            background: linear-gradient(165deg, rgba(58, 16, 48, 0.75), rgba(18, 7, 15, 0.9));
            padding: 2.2rem 2rem 3.2rem 2rem;
            border-radius: 26px;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            text-align: center;
            width: 85%;
            max-width: 380px;
            border: 1px solid var(--gold-line);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(2px);
        }

        .sigil {
            font-size: 1.1rem;
            color: var(--rose-gold);
            letter-spacing: 0.3em;
            margin-bottom: 6px;
            opacity: 0.8;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 50px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            color: var(--ink-dim);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(145deg, var(--wine-bright), var(--wine));
            color: var(--ink);
            box-shadow: 0 2px 10px rgba(176, 41, 79, 0.5);
        }

        h1 {
            color: var(--rose-gold-soft);
            margin-bottom: 18px;
            font-size: 1.35rem;
            min-height: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .game-console {
            position: relative;
            margin-bottom: 44px;
            perspective: 1000px;
        }

        .display-box {
            background:
                radial-gradient(circle at 50% 30%, rgba(176, 41, 79, 0.25), transparent 70%),
                linear-gradient(165deg, #24101f, #150810);
            height: 210px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            border: 1px solid var(--gold-line);
            transition: all 0.3s ease;
            padding: 10px;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .display-box::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, var(--rose-gold) 1px, transparent 1px);
            background-size: 26px 26px;
            opacity: 0.06;
        }

        .display-box.revealed {
            border-color: var(--wine-bright);
            box-shadow: inset 0 0 25px rgba(0,0,0,0.4), 0 0 25px rgba(176, 41, 79, 0.35);
        }

        .food-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
            position: relative;
            z-index: 1;
        }

        .food-name {
            font-size: 1.35rem;
            font-weight: bold;
            color: var(--ink);
            line-height: 1.3;
            padding: 0 10px;
            position: relative;
            z-index: 1;
        }

        .fortune-line {
            font-size: 0.78rem;
            color: var(--rose-gold);
            margin-top: 8px;
            opacity: 0.85;
            position: relative;
            z-index: 1;
            letter-spacing: 0.03em;
        }

        button.action-btn {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--wine-bright), var(--wine));
            border: 4px solid var(--bg-deep-2);
            outline: 1px solid var(--gold-line);
            color: var(--rose-gold-soft);
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(176, 41, 79, 0.55);
            transition: all 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        button.action-btn:active {
            transform: translateX(-50%) scale(0.9);
            box-shadow: 0 3px 8px rgba(176, 41, 79, 0.5);
        }

        button.action-btn:disabled {
            background: #3a2f36;
            color: #7a6b73;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-hint {
            position: absolute;
            bottom: -56px;
            left: 0;
            right: 0;
            font-size: 0.78rem;
            color: var(--ink-dim);
            pointer-events: none;
        }

        .menu-details {
            display: none;
            margin-top: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .menu-item {
            padding: 7px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.9rem;
            color: var(--ink-dim);
            display: flex;
            align-items: center;
        }

        .menu-item:last-child { border-bottom: none; }

        .menu-item span {
            margin-right: 8px;
        }

        .toggle-menu {
            color: var(--ink-dim);
            text-decoration: underline;
            text-decoration-color: var(--gold-line);
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 28px;
            display: inline-block;
            transition: color 0.2s;
        }

        .toggle-menu:hover {
            color: var(--rose-gold-soft);
        }

        .nearby-btn {
            display: none;
            margin-top: 16px;
            padding: 9px 18px;
            border-radius: 30px;
            border: 1px solid var(--gold-line);
            background: rgba(224, 168, 154, 0.08);
            color: var(--rose-gold-soft);
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nearby-btn.show {
            display: inline-block;
        }

        .nearby-btn:hover {
            background: rgba(224, 168, 154, 0.18);
        }

        .nearby-btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .nearby-status {
            display: block;
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--ink-dim);
            min-height: 1em;
        }
    </style>
</head>
<body>

<svg class="constellation" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
    <g stroke="#e0a89a" stroke-width="1" fill="#e0a89a">
        <line x1="60" y1="90" x2="100" y2="140"></line>
        <line x1="100" y1="140" x2="150" y2="160"></line>
        <line x1="150" y1="160" x2="210" y2="150"></line>
        <line x1="210" y1="150" x2="260" y2="190"></line>
        <line x1="260" y1="190" x2="290" y2="250"></line>
        <line x1="290" y1="250" x2="270" y2="310"></line>
        <line x1="270" y1="310" x2="300" y2="360"></line>
        <line x1="300" y1="360" x2="340" y2="380"></line>
        <circle cx="60" cy="90" r="2.4"></circle>
        <circle cx="100" cy="140" r="2"></circle>
        <circle cx="150" cy="160" r="2.8"></circle>
        <circle cx="210" cy="150" r="2"></circle>
        <circle cx="260" cy="190" r="2.4"></circle>
        <circle cx="290" cy="250" r="2"></circle>
        <circle cx="270" cy="310" r="2"></circle>
        <circle cx="300" cy="360" r="2.2"></circle>
        <circle cx="340" cy="380" r="3"></circle>
    </g>
    <g stroke="#7a1f3d" stroke-width="0.6" fill="#b0294f" opacity="0.6">
        <line x1="40" y1="650" x2="90" y2="600"></line>
        <line x1="90" y1="600" x2="140" y2="640"></line>
        <line x1="140" y1="640" x2="120" y2="700"></line>
        <circle cx="40" cy="650" r="1.8"></circle>
        <circle cx="90" cy="600" r="1.6"></circle>
        <circle cx="140" cy="640" r="2"></circle>
        <circle cx="120" cy="700" r="1.6"></circle>
    </g>
</svg>

<div class="container">
    <div class="sigil">♏</div>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchMode('breakfast')">早餐 ☀️</button>
        <button class="tab-btn" onclick="switchMode('lunch')">午餐 🕛</button>
    </div>

    <h1 id="title">阿肥早餐吃什麼？</h1>

    <div class="game-console">
        <div class="display-box" id="displayBox">
            <div class="food-icon" id="foodIcon">❓</div>
            <div class="food-name" id="foodName">點下面按鈕，命運自有安排</div>
        </div>

        <button id="btn" class="action-btn" onclick="decideFood()">🔮</button>
        <div class="btn-hint">點擊揭曉今日指令</div>
    </div>

    <button id="nearbyBtn" class="nearby-btn" onclick="findNearby()">📍 附近哪裡吃</button>
    <span class="nearby-status" id="nearbyStatus"></span>

    <div class="toggle-menu" onclick="toggleMenu()">窺探全部祕密</div>
    <div class="menu-details" id="menuDetails"></div>
</div>

<script>
    // --- 菜單設定區 ---

    const breakfastMenu = [
        { name: "玉米起司蛋餅+鮮奶茶", icon: "🧀" },
        { name: "蔬菜蛋餅", icon: "🥬" },
        { name: "朝柴蘿蔔糕+蛋+紅茶", icon: "🍳" },
        { name: "好事蛋沙拉+生菜+紅茶", icon: "🥗" },
        { name: "好事三明治+蛋+紅茶", icon: "🥪" },
        { name: "飯糰", icon: "🍙" },
        { name: "蘿蔔糕", icon: "🥢" },
        { name: "燒餅油條", icon: "🥖" },
        { name: "饅頭+蛋", icon: "🥯" },
        { name: "摩斯", icon: "🍔" },
        { name: "路伊莎", icon: "☕" },
        { name: "其他", icon: "✨" }
    ];

    // 這裡是你更新後的午餐菜單
    const lunchMenu = [
        { name: "自助餐", icon: "🍱" },
        { name: "燒臘", icon: "🍖" },
        { name: "全家", icon: "🏪" },
        { name: "兔子", icon: "🐰" },
        { name: "巧之味", icon: "🥟" },
        { name: "福州乾拌麵", icon: "🍜" },
        { name: "有煎餃子", icon: "🥘" },
        { name: "其他", icon: "✨" },
        { name: "超商隨便吃", icon: "🍙" }
    ];

    const fortuneLines = [
        "命運已決定，不准反悔。",
        "今天，就聽天蠍的。",
        "抗拒是沒有用的。",
        "這是唯一的正確答案。",
        "吃這個，不接受任何異議。",
        "秘密揭曉，照做就對了。"
    ];

    // --- 程式邏輯區 ---

    let currentMenu = breakfastMenu;
    let isRolling = false;
    let mode = 'breakfast';
    let finalFoodName = '';

    const displayBox = document.getElementById('displayBox');
    const foodName = document.getElementById('foodName');
    const foodIcon = document.getElementById('foodIcon');
    const btn = document.getElementById('btn');
    const menuDetails = document.getElementById('menuDetails');
    const title = document.getElementById('title');
    const tabBtns = document.querySelectorAll('.tab-btn');
    const nearbyBtn = document.getElementById('nearbyBtn');
    const nearbyStatus = document.getElementById('nearbyStatus');

    updateMenuList();

    function switchMode(selectedMode) {
        if (isRolling) return;

        mode = selectedMode;

        tabBtns.forEach(b => b.classList.remove('active'));
        displayBox.classList.remove('revealed');

        if (mode === 'breakfast') {
            tabBtns[0].classList.add('active');
            currentMenu = breakfastMenu;
            title.innerText = "阿肥早餐吃什麼？";
        } else {
            tabBtns[1].classList.add('active');
            currentMenu = lunchMenu;
            title.innerText = "阿肥午餐吃什麼？";
        }

        foodIcon.innerText = "❓";
        foodName.innerText = "點下面按鈕，命運自有安排";
        removeFortuneLine();
        btn.innerHTML = "🔮";
        nearbyBtn.classList.remove('show');
        nearbyStatus.innerText = '';

        updateMenuList();
    }

    function updateMenuList() {
        menuDetails.innerHTML = currentMenu.map(item =>
            `<div class="menu-item"><span>${item.icon}</span> ${item.name}</div>`
        ).join('');
    }

    function decideFood() {
        if (isRolling) return;
        isRolling = true;
        btn.disabled = true;
        displayBox.classList.remove('revealed');
        removeFortuneLine();
        nearbyBtn.classList.remove('show');
        nearbyStatus.innerText = '';

        let speed = 50;
        let totalTime = 0;

        const timer = setInterval(() => {
            const randomItem = currentMenu[Math.floor(Math.random() * currentMenu.length)];
            foodName.innerText = randomItem.name;
            foodIcon.innerText = randomItem.icon;

            totalTime += speed;

            if (totalTime > 2000) speed += 20;

            if (totalTime > 3000) {
                clearInterval(timer);
                endRoll();
            }
        }, speed);
    }

    function endRoll() {
        const finalItem = currentMenu[Math.floor(Math.random() * currentMenu.length)];
        foodName.innerText = finalItem.name;
        foodIcon.innerText = finalItem.icon;
        finalFoodName = finalItem.name;

        displayBox.classList.add('revealed');

        const line = document.createElement('div');
        line.className = 'fortune-line';
        line.id = 'fortuneLine';
        line.innerText = fortuneLines[Math.floor(Math.random() * fortuneLines.length)];
        displayBox.appendChild(line);

        isRolling = false;
        btn.disabled = false;
        btn.innerHTML = "🔄";
        nearbyBtn.classList.add('show');
    }

    function removeFortuneLine() {
        const existing = document.getElementById('fortuneLine');
        if (existing) existing.remove();
    }

    function findNearby() {
        if (!navigator.geolocation) {
            nearbyStatus.innerText = '這個瀏覽器不支援定位功能';
            return;
        }

        nearbyBtn.disabled = true;
        nearbyStatus.innerText = '正在窺探你的座標...';

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const { latitude, longitude } = position.coords;
                const keyword = pickSearchKeyword();
                const url = `https://www.google.com/maps/search/${encodeURIComponent(keyword)}/@${latitude},${longitude},16z`;
                window.open(url, '_blank');
                nearbyStatus.innerText = '';
                nearbyBtn.disabled = false;
            },
            (error) => {
                nearbyBtn.disabled = false;
                if (error.code === error.PERMISSION_DENIED) {
                    nearbyStatus.innerText = '需要允許定位權限才能找店家';
                } else {
                    nearbyStatus.innerText = '定位失敗，請稍後再試';
                }
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function pickSearchKeyword() {
        const genericFallback = mode === 'breakfast' ? '早餐店' : '午餐 餐廳';
        if (!finalFoodName) return genericFallback;

        const firstPart = finalFoodName.split('+')[0].trim();
        const vagueTerms = ['其他', '超商隨便吃'];

        return vagueTerms.includes(firstPart) ? genericFallback : firstPart;
    }

    function toggleMenu() {
        if (menuDetails.style.display === "block") {
            menuDetails.style.display = "none";
        } else {
            menuDetails.style.display = "block";
        }
    }
</script>

</body>
</html>
