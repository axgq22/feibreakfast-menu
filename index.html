<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肥寶今天吃什麼？</title>
    <style>
        :root {
            --bg-deep: #12070f;
            --bg-deep-2: #1c0b1a;
            --plum: #3a1030;
            --wine: #7a1f3d;
            --wine-bright: #b0294f;
            --rose-gold: #e0a89a;
            --rose-gold-soft: #f0c6b8;
            --ink: #f3e6ea;
            --ink-dim: #b79aa8;
            --gold-line: rgba(224, 168, 154, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background:
                radial-gradient(ellipse at 20% 10%, rgba(122, 31, 61, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 85%, rgba(58, 16, 48, 0.5) 0%, transparent 60%),
                linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            position: relative;
            overflow-x: hidden;
        }

        /* Scorpius constellation, faint, fixed in the background */
        .constellation {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.35;
            pointer-events: none;
        }

        .container {
            background: linear-gradient(165deg, rgba(58, 16, 48, 0.75), rgba(18, 7, 15, 0.9));
            padding: 2.2rem 2rem 3.2rem 2rem;
            border-radius: 26px;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            text-align: center;
            width: 85%;
            max-width: 380px;
            border: 1px solid var(--gold-line);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(2px);
        }

        .sigil {
            font-size: 1.1rem;
            color: var(--rose-gold);
            letter-spacing: 0.3em;
            margin-bottom: 6px;
            opacity: 0.8;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 50px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            color: var(--ink-dim);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(145deg, var(--wine-bright), var(--wine));
            color: var(--ink);
            box-shadow: 0 2px 10px rgba(176, 41, 79, 0.5);
        }

        h1 {
            color: var(--rose-gold-soft);
            margin-bottom: 18px;
            font-size: 1.35rem;
            min-height: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .game-console {
            position: relative;
            margin-bottom: 44px;
            perspective: 1000px;
        }

        .display-box {
            background:
                radial-gradient(circle at 50% 30%, rgba(176, 41, 79, 0.25), transparent 70%),
                linear-gradient(165deg, #24101f, #150810);
            height: 210px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            border: 1px solid var(--gold-line);
            transition: all 0.3s ease;
            padding: 10px;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .display-box::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, var(--rose-gold) 1px, transparent 1px);
            background-size: 26px 26px;
            opacity: 0.06;
        }

        .display-box.revealed {
            border-color: var(--wine-bright);
            box-shadow: inset 0 0 25px rgba(0,0,0,0.4), 0 0 25px rgba(176, 41, 79, 0.35);
        }

        .food-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
            position: relative;
            z-index: 1;
        }

        .food-name {
            font-size: 1.35rem;
            font-weight: bold;
            color: var(--ink);
            line-height: 1.3;
            padding: 0 10px;
            position: relative;
            z-index: 1;
        }

        .fortune-line {
            font-size: 0.78rem;
            color: var(--rose-gold);
            margin-top: 8px;
            opacity: 0.85;
            position: relative;
            z-index: 1;
            letter-spacing: 0.03em;
        }

        button.action-btn {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--wine-bright), var(--wine));
            border: 4px solid var(--bg-deep-2);
            outline: 1px solid var(--gold-line);
            color: var(--rose-gold-soft);
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(176, 41, 79, 0.55);
            transition: all 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        button.action-btn:active {
            transform: translateX(-50%) scale(0.9);
            box-shadow: 0 3px 8px rgba(176, 41, 79, 0.5);
        }

        button.action-btn:disabled {
            background: #3a2f36;
            color: #7a6b73;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-hint {
            position: absolute;
            bottom: -56px;
            left: 0;
            right: 0;
            font-size: 0.78rem;
            color: var(--ink-dim);
            pointer-events: none;
        }

        .menu-details {
            display: none;
            margin-top: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            text-align: left;
            max-height: 240px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .menu-item {
            padding: 7px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.9rem;
            color: var(--ink-dim);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .menu-item-label {
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .menu-item-label span {
            margin-right: 8px;
        }

        .menu-item-label .txt {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .menu-item:last-child { border-bottom: none; }

        .delete-item-btn {
            flex-shrink: 0;
            border: none;
            background: rgba(176, 41, 79, 0.25);
            color: var(--rose-gold-soft);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-item-btn:hover {
            background: rgba(176, 41, 79, 0.5);
        }

        .add-item-row {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .add-item-row input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--gold-line);
            border-radius: 8px;
            color: var(--ink);
            padding: 6px 8px;
            font-size: 0.85rem;
            font-family: inherit;
        }

        .add-item-row input#newItemIcon {
            width: 44px;
            text-align: center;
            flex-shrink: 0;
        }

        .add-item-row input#newItemName {
            flex: 1;
            min-width: 0;
        }

        .add-item-row button {
            flex-shrink: 0;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            background: linear-gradient(145deg, var(--wine-bright), var(--wine));
            color: var(--ink);
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .toggle-menu {
            color: var(--ink-dim);
            text-decoration: underline;
            text-decoration-color: var(--gold-line);
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 28px;
            display: inline-block;
            transition: color 0.2s;
        }

        .toggle-menu:hover {
            color: var(--rose-gold-soft);
        }

        .nearby-btn {
            display: none;
            margin-top: 16px;
            padding: 9px 18px;
            border-radius: 30px;
            border: 1px solid var(--gold-line);
            background: rgba(224, 168, 154, 0.08);
            color: var(--rose-gold-soft);
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nearby-btn.show {
            display: inline-block;
        }

        .nearby-btn:hover {
            background: rgba(224, 168, 154, 0.18);
        }

        .nearby-btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .nearby-status {
            display: block;
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--ink-dim);
            min-height: 1em;
        }

        .sync-status {
            display: block;
            margin-top: 6px;
            font-size: 0.7rem;
            color: var(--ink-dim);
            opacity: 0.7;
            min-height: 1em;
        }

        .history-details {
            display: none;
            margin-top: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            text-align: left;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .history-empty {
            font-size: 0.85rem;
            color: var(--ink-dim);
            text-align: center;
            padding: 6px 0;
        }

        .history-item {
            padding: 7px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.85rem;
            color: var(--ink-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-item:last-child { border-bottom: none; }

        .history-item .h-mode {
            flex-shrink: 0;
            font-size: 0.7rem;
            color: var(--rose-gold);
            border: 1px solid var(--gold-line);
            border-radius: 8px;
            padding: 1px 6px;
        }

        .history-item .h-name {
            flex: 1;
            min-width: 0;
            color: var(--ink);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item .h-time {
            flex-shrink: 0;
            font-size: 0.72rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<svg class="constellation" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
    <g stroke="#e0a89a" stroke-width="1" fill="#e0a89a">
        <line x1="60" y1="90" x2="100" y2="140"></line>
        <line x1="100" y1="140" x2="150" y2="160"></line>
        <line x1="150" y1="160" x2="210" y2="150"></line>
        <line x1="210" y1="150" x2="260" y2="190"></line>
        <line x1="260" y1="190" x2="290" y2="250"></line>
        <line x1="290" y1="250" x2="270" y2="310"></line>
        <line x1="270" y1="310" x2="300" y2="360"></line>
        <line x1="300" y1="360" x2="340" y2="380"></line>
        <circle cx="60" cy="90" r="2.4"></circle>
        <circle cx="100" cy="140" r="2"></circle>
        <circle cx="150" cy="160" r="2.8"></circle>
        <circle cx="210" cy="150" r="2"></circle>
        <circle cx="260" cy="190" r="2.4"></circle>
        <circle cx="290" cy="250" r="2"></circle>
        <circle cx="270" cy="310" r="2"></circle>
        <circle cx="300" cy="360" r="2.2"></circle>
        <circle cx="340" cy="380" r="3"></circle>
    </g>
    <g stroke="#7a1f3d" stroke-width="0.6" fill="#b0294f" opacity="0.6">
        <line x1="40" y1="650" x2="90" y2="600"></line>
        <line x1="90" y1="600" x2="140" y2="640"></line>
        <line x1="140" y1="640" x2="120" y2="700"></line>
        <circle cx="40" cy="650" r="1.8"></circle>
        <circle cx="90" cy="600" r="1.6"></circle>
        <circle cx="140" cy="640" r="2"></circle>
        <circle cx="120" cy="700" r="1.6"></circle>
    </g>
</svg>

<div class="container">
    <div class="sigil">♏</div>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchMode('breakfast')">早餐 ☀️</button>
        <button class="tab-btn" onclick="switchMode('lunch')">午餐 🕛</button>
    </div>

    <h1 id="title">阿肥早餐吃什麼？</h1>

    <div class="game-console">
        <div class="display-box" id="displayBox">
            <div class="food-icon" id="foodIcon">❓</div>
            <div class="food-name" id="foodName">點下面按鈕，命運自有安排</div>
        </div>

        <button id="btn" class="action-btn" onclick="decideFood()">🔮</button>
        <div class="btn-hint">點擊揭曉今日指令</div>
    </div>

    <button id="nearbyBtn" class="nearby-btn" onclick="findNearby()">📍 附近哪裡吃</button>
    <span class="nearby-status" id="nearbyStatus"></span>

    <div class="toggle-menu" onclick="toggleMenu()">窺探全部祕密</div>
    <div class="menu-details" id="menuDetails">
        <div id="menuList"></div>
        <div class="add-item-row">
            <input type="text" id="newItemIcon" placeholder="🍚" maxlength="4">
            <input type="text" id="newItemName" placeholder="新增一個選項..." maxlength="30">
            <button onclick="addItem()">新增</button>
        </div>
    </div>

    <div class="toggle-menu" onclick="toggleHistory()">查看歷史紀錄</div>
    <div class="history-details" id="historyDetails">
        <div id="historyList"><div class="history-empty">還沒有紀錄</div></div>
    </div>

    <span class="sync-status" id="syncStatus">連線中...</span>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import {
        getFirestore, doc, getDoc, setDoc, onSnapshot,
        collection, addDoc, query, orderBy, limit, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDN•••••••••••••••••••••••••••••••",
        authDomain: "feibreakfast.firebaseapp.com",
        projectId: "feibreakfast",
        storageBucket: "feibreakfast.firebasestorage.app",
        messagingSenderId: "482879384530",
        appId: "1:482879384530:web:4c0346173124282bc1760b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- 預設菜單（第一次啟用時會寫入雲端，之後就以雲端資料為準）---

    const defaultBreakfastMenu = [
        { name: "玉米起司蛋餅+鮮奶茶", icon: "🧀" },
        { name: "蔬菜蛋餅", icon: "🥬" },
        { name: "朝柴蘿蔔糕+蛋+紅茶", icon: "🍳" },
        { name: "好事蛋沙拉+生菜+紅茶", icon: "🥗" },
        { name: "好事三明治+蛋+紅茶", icon: "🥪" },
        { name: "飯糰", icon: "🍙" },
        { name: "蘿蔔糕", icon: "🥢" },
        { name: "燒餅油條", icon: "🥖" },
        { name: "饅頭+蛋", icon: "🥯" },
        { name: "摩斯", icon: "🍔" },
        { name: "路伊莎", icon: "☕" },
        { name: "其他", icon: "✨" }
    ];

    const defaultLunchMenu = [
        { name: "自助餐", icon: "🍱" },
        { name: "燒臘", icon: "🍖" },
        { name: "全家", icon: "🏪" },
        { name: "兔子", icon: "🐰" },
        { name: "巧之味", icon: "🥟" },
        { name: "福州乾拌麵", icon: "🍜" },
        { name: "有煎餃子", icon: "🥘" },
        { name: "其他", icon: "✨" },
        { name: "超商隨便吃", icon: "🍙" }
    ];

    const fortuneLines = [
        "命運已決定，不准反悔。",
        "今天，就聽天蠍的。",
        "抗拒是沒有用的。",
        "這是唯一的正確答案。",
        "吃這個，不接受任何異議。",
        "秘密揭曉，照做就對了。"
    ];

    // --- 程式邏輯區 ---

    let breakfastMenu = [];
    let lunchMenu = [];
    let currentMenu = [];
    let isRolling = false;
    let mode = 'breakfast';
    let finalFoodName = '';

    const displayBox = document.getElementById('displayBox');
    const foodName = document.getElementById('foodName');
    const foodIcon = document.getElementById('foodIcon');
    const btn = document.getElementById('btn');
    const menuList = document.getElementById('menuList');
    const title = document.getElementById('title');
    const tabBtns = document.querySelectorAll('.tab-btn');
    const nearbyBtn = document.getElementById('nearbyBtn');
    const nearbyStatus = document.getElementById('nearbyStatus');
    const syncStatus = document.getElementById('syncStatus');

    async function initMenu(menuId, defaultItems, applyFn) {
        const ref = doc(db, 'menus', menuId);
        try {
            const snap = await getDoc(ref);
            if (!snap.exists()) {
                await setDoc(ref, { items: defaultItems });
            }
        } catch (e) {
            console.error('init failed', e);
        }

        onSnapshot(ref, (snap) => {
            const data = snap.data();
            const items = (data && Array.isArray(data.items) && data.items.length > 0)
                ? data.items
                : defaultItems;
            applyFn(items);
            syncStatus.innerText = '';
        }, (err) => {
            console.error('sync error', err);
            syncStatus.innerText = '雲端連線失敗，暫時用本機菜單';
        });
    }

    initMenu('breakfast', defaultBreakfastMenu, (items) => {
        breakfastMenu = items;
        if (mode === 'breakfast') {
            currentMenu = breakfastMenu;
            renderMenuList();
        }
    });

    initMenu('lunch', defaultLunchMenu, (items) => {
        lunchMenu = items;
        if (mode === 'lunch') {
            currentMenu = lunchMenu;
            renderMenuList();
        }
    });

    const historyList = document.getElementById('historyList');
    const historyQuery = query(collection(db, 'history'), orderBy('ts', 'desc'), limit(20));

    onSnapshot(historyQuery, (snap) => {
        if (snap.empty) {
            historyList.innerHTML = '<div class="history-empty">還沒有紀錄</div>';
            return;
        }
        historyList.innerHTML = snap.docs.map(d => {
            const data = d.data();
            const modeLabel = data.mode === 'breakfast' ? '早餐' : '午餐';
            const timeLabel = formatHistoryTime(data.ts);
            return `
                <div class="history-item">
                    <span class="h-mode">${modeLabel}</span>
                    <span class="h-name">${escapeHtml(data.icon || '')} ${escapeHtml(data.name || '')}</span>
                    <span class="h-time">${timeLabel}</span>
                </div>
            `;
        }).join('');
    }, (err) => {
        console.error('history sync error', err);
    });

    function formatHistoryTime(ts) {
        if (!ts || typeof ts.toDate !== 'function') return '剛剛';
        const d = ts.toDate();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${mm}/${dd} ${hh}:${min}`;
    }

    async function recordHistory(item) {
        try {
            await addDoc(collection(db, 'history'), {
                mode,
                name: item.name,
                icon: item.icon,
                ts: serverTimestamp()
            });
        } catch (e) {
            console.error('record history failed', e);
        }
    }

    window.switchMode = function (selectedMode) {
        if (isRolling) return;

        mode = selectedMode;

        tabBtns.forEach(b => b.classList.remove('active'));
        displayBox.classList.remove('revealed');

        if (mode === 'breakfast') {
            tabBtns[0].classList.add('active');
            currentMenu = breakfastMenu;
            title.innerText = "阿肥早餐吃什麼？";
        } else {
            tabBtns[1].classList.add('active');
            currentMenu = lunchMenu;
            title.innerText = "阿肥午餐吃什麼？";
        }

        foodIcon.innerText = "❓";
        foodName.innerText = "點下面按鈕，命運自有安排";
        removeFortuneLine();
        btn.innerHTML = "🔮";
        nearbyBtn.classList.remove('show');
        nearbyStatus.innerText = '';

        renderMenuList();
    };

    function renderMenuList() {
        menuList.innerHTML = currentMenu.map((item, index) => `
            <div class="menu-item">
                <div class="menu-item-label">
                    <span>${escapeHtml(item.icon)}</span>
                    <span class="txt">${escapeHtml(item.name)}</span>
                </div>
                <button class="delete-item-btn" onclick="deleteItem(${index})">✕</button>
            </div>
        `).join('');
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.innerText = str == null ? '' : String(str);
        return div.innerHTML;
    }

    async function saveCurrentMenu() {
        const menuId = mode === 'breakfast' ? 'breakfast' : 'lunch';
        try {
            await setDoc(doc(db, 'menus', menuId), { items: currentMenu });
        } catch (e) {
            console.error('save failed', e);
            syncStatus.innerText = '儲存失敗，請檢查網路後再試一次';
        }
    }

    window.addItem = function () {
        const iconInput = document.getElementById('newItemIcon');
        const nameInput = document.getElementById('newItemName');
        const icon = iconInput.value.trim() || '🍽️';
        const name = nameInput.value.trim();

        if (!name) {
            nameInput.focus();
            return;
        }

        currentMenu = [...currentMenu, { name, icon }];
        if (mode === 'breakfast') breakfastMenu = currentMenu;
        else lunchMenu = currentMenu;

        renderMenuList();
        saveCurrentMenu();

        iconInput.value = '';
        nameInput.value = '';
        nameInput.focus();
    };

    window.deleteItem = function (index) {
        currentMenu = currentMenu.filter((_, i) => i !== index);
        if (mode === 'breakfast') breakfastMenu = currentMenu;
        else lunchMenu = currentMenu;

        renderMenuList();
        saveCurrentMenu();
    };

    window.decideFood = function () {
        if (isRolling || currentMenu.length === 0) return;
        isRolling = true;
        btn.disabled = true;
        displayBox.classList.remove('revealed');
        removeFortuneLine();
        nearbyBtn.classList.remove('show');
        nearbyStatus.innerText = '';

        let speed = 50;
        let totalTime = 0;

        const timer = setInterval(() => {
            const randomItem = currentMenu[Math.floor(Math.random() * currentMenu.length)];
            foodName.innerText = randomItem.name;
            foodIcon.innerText = randomItem.icon;

            totalTime += speed;

            if (totalTime > 2000) speed += 20;

            if (totalTime > 3000) {
                clearInterval(timer);
                endRoll();
            }
        }, speed);
    };

    function endRoll() {
        const finalItem = currentMenu[Math.floor(Math.random() * currentMenu.length)];
        foodName.innerText = finalItem.name;
        foodIcon.innerText = finalItem.icon;
        finalFoodName = finalItem.name;

        displayBox.classList.add('revealed');

        const line = document.createElement('div');
        line.className = 'fortune-line';
        line.id = 'fortuneLine';
        line.innerText = fortuneLines[Math.floor(Math.random() * fortuneLines.length)];
        displayBox.appendChild(line);

        isRolling = false;
        btn.disabled = false;
        btn.innerHTML = "🔄";
        nearbyBtn.classList.add('show');

        recordHistory(finalItem);
    }

    function removeFortuneLine() {
        const existing = document.getElementById('fortuneLine');
        if (existing) existing.remove();
    }

    window.findNearby = function () {
        if (!navigator.geolocation) {
            nearbyStatus.innerText = '這個瀏覽器不支援定位功能';
            return;
        }

        nearbyBtn.disabled = true;
        nearbyStatus.innerText = '正在窺探你的座標...';

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const { latitude, longitude } = position.coords;
                const keyword = pickSearchKeyword();
                const url = `https://www.google.com/maps/search/${encodeURIComponent(keyword)}/@${latitude},${longitude},16z`;
                window.open(url, '_blank');
                nearbyStatus.innerText = '';
                nearbyBtn.disabled = false;
            },
            (error) => {
                nearbyBtn.disabled = false;
                if (error.code === error.PERMISSION_DENIED) {
                    nearbyStatus.innerText = '需要允許定位權限才能找店家';
                } else {
                    nearbyStatus.innerText = '定位失敗，請稍後再試';
                }
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    };

    function pickSearchKeyword() {
        const genericFallback = mode === 'breakfast' ? '早餐店' : '午餐 餐廳';
        if (!finalFoodName) return genericFallback;

        const firstPart = finalFoodName.split('+')[0].trim();
        const vagueTerms = ['其他', '超商隨便吃'];

        return vagueTerms.includes(firstPart) ? genericFallback : firstPart;
    }

    window.toggleMenu = function () {
        const menuDetails = document.getElementById('menuDetails');
        if (menuDetails.style.display === "block") {
            menuDetails.style.display = "none";
        } else {
            menuDetails.style.display = "block";
        }
    };

    window.toggleHistory = function () {
        const historyDetails = document.getElementById('historyDetails');
        if (historyDetails.style.display === "block") {
            historyDetails.style.display = "none";
        } else {
            historyDetails.style.display = "block";
        }
    };
</script>
